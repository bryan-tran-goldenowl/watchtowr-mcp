[project]
name = "watchtowr-mcp"
version = "0.1.2"
description = "MCP server for the watchTowr Platform"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.1.1",
    "httpx>=0.28.1",
    "mcp>=1.26.0",
    "pydantic>=2.12.5",
    "python-dateutil>=2.9.0.post0",
    "urllib3>=2.6.3",
]

[project.scripts]
watchtowr-mcp = "watchtowr_mcp_server.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchtowr_mcp_server"] 
